<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC | ForgePC Mauricie</title>
<style>
:root{--orange:#ff6500;--bg:#080a0b;--panel:#111416;--line:#30353a;--text:#f5f5f5;--muted:#c8c8c8;--max:1180px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}
.container{width:min(calc(100% - 40px),var(--max));margin:auto}
header{border-bottom:1px solid #292d30;background:#080a0b}
.nav{height:166px;display:flex;align-items:center;justify-content:space-between;gap:30px}
.brand{width:175px;height:auto;display:block}
nav{display:flex;align-items:center;gap:34px;font-weight:800}
nav a{text-decoration:none;text-transform:uppercase;font-size:15px}
nav a:hover{color:var(--orange)}
nav .btn{border:1px solid var(--orange);padding:15px 20px;border-radius:6px}
.menu{display:none;background:none;border:0;color:#fff;font-size:30px}
.page{padding:58px 0 90px;min-height:600px}
#app{min-height:300px}
.loading,.error{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:34px;font-size:18px}
.error h1{margin-top:0}
.detail-wrap{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:46px;align-items:start}
.gallery{min-width:0}
.main-photo{display:block;width:100%;height:520px;object-fit:contain;background:#0d0f10;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.thumb{width:100%;height:110px;object-fit:cover;background:#0d0f10;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.thumb:hover{border-color:var(--orange)}
.status{display:inline-block;border:1px solid var(--orange);color:var(--orange);padding:9px 12px;border-radius:6px;font-weight:900;text-transform:uppercase;font-size:13px;margin-bottom:18px}
.kicker{color:var(--orange);font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:13px;margin-bottom:14px}
h1{font-size:clamp(44px,6vw,76px);line-height:.95;margin:0 0 24px;letter-spacing:-.04em}
.intro{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 28px}
.box{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:22px;margin-top:16px}
.box h2{font-size:18px;margin:0 0 16px;text-transform:uppercase}
.specs{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.specs li{line-height:1.4}
.price-box .price{font-size:32px;font-weight:900;color:var(--orange)}
.pc-navigation{display:flex;justify-content:space-between;gap:14px;margin-top:28px}
.pc-navigation a{display:inline-flex;justify-content:center;align-items:center;padding:14px 18px;border-radius:6px;text-decoration:none;font-weight:900;text-transform:uppercase}
.back{border:1px solid #555;background:#111315}
.rdv-button{background:var(--orange);color:#08090a}
footer{border-top:1px solid #292d30;padding:28px 0;color:#aaa;text-align:center}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;align-items:center;justify-content:center;padding:30px}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
.close{position:absolute;top:18px;right:22px;border:0;background:none;color:#fff;font-size:34px;cursor:pointer}
@media(max-width:800px){
 .nav{height:100px}.brand{width:150px}nav{display:none}.menu{display:block}
 .detail-wrap{grid-template-columns:1fr}.main-photo{height:420px}
}
@media(max-width:600px){
 .container{width:min(calc(100% - 28px),var(--max))}
 .main-photo{height:300px}.thumbs{grid-template-columns:repeat(2,1fr)}
 .thumb{height:100px}.pc-navigation{flex-direction:column}
 .pc-navigation a{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" aria-label="ForgePC Mauricie">
      <img class="brand" src="Assets/logo.png" alt="ForgePC Mauricie">
    </a>
    <button class="menu" aria-label="Ouvrir le menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="inventaire.html">Inventaire</a>
      <a class="btn" href="rendez-vous.html">Demander un rendez-vous</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#service-domicile">À domicile</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="container" id="app">
    <div class="loading">Chargement de la fiche…</div>
  </div>
</main>

<footer>© 2026 ForgePC Mauricie · Votre technologie, <strong>notre expertise.</strong></footer>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" alt="Photo du PC">
</div>

<script>
const SHEET_ID="15llqGhrLL9I6SFxyFrxfbNY2ZuBXDswok_BwxPR7JqU";
const SHEET_NAME="Inventaire";
const rawId=new URLSearchParams(location.search).get("id")||"001";
const wantedId=String(rawId).trim().replace(/^pc[- ]?/i,"").replace(/^0+(?=\d)/,"")||"001";
const app=document.getElementById("app");

function esc(s){
  return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function cleanId(v){
  return String(v??"").trim().replace(/^pc[- ]?/i,"").replace(/^0+(?=\d)/,"");
}

function driveImageUrl(value){
  const s=String(value||"").trim();
  if(!s)return "";
  if(s.startsWith("data:")||s.startsWith("blob:"))return s;
  if(!s.includes("drive.google.com"))return s;
  let m=s.match(/drive\.google\.com\/file\/d\/([^/?#]+)/i);
  if(!m)m=s.match(/[?&]id=([^&#]+)/i);
  if(!m)m=s.match(/drive\.google\.com\/open\?id=([^&#]+)/i);
  if(!m)return s;
  return "https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1600";
}

function parseVisualization(data){
  const table=data && data.table;
  if(!table || !Array.isArray(table.cols) || !Array.isArray(table.rows)) return [];
  const headers=table.cols.map(c=>String(c.label||c.id||"").toLowerCase().trim());
  return table.rows.map(r=>{
    const values=(r.c||[]).map(c=>{
      if(!c)return "";
      return c.f!=null ? String(c.f) : (c.v!=null ? String(c.v) : "");
    });
    const obj={};
    headers.forEach((h,i)=>obj[h]=values[i]??"");
    return obj;
  }).filter(x=>Object.values(x).some(v=>String(v).trim()!==""));
}

function loadSheetJsonp(){
  return new Promise((resolve,reject)=>{
    const callback="forgepc_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error("Délai dépassé pour Google Sheets"));
    },12000);
    function cleanup(){
      clearTimeout(timeout);
      delete window[callback];
      script.remove();
    }
    window[callback]=data=>{
      cleanup();
      resolve(data);
    };
    script.onerror=()=>{
      cleanup();
      reject(new Error("Google Sheets inaccessible"));
    };
    script.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
      "/gviz/tq?sheet="+encodeURIComponent(SHEET_NAME)+
      "&tqx="+encodeURIComponent("responseHandler:"+callback)+
      "&_="+Date.now();
    document.head.appendChild(script);
  });
}

function normalize(row){
  const get=(...keys)=>{
    for(const key of keys){
      if(row[key]!==undefined && String(row[key]).trim()!=="") return String(row[key]).trim();
    }
    return "";
  };
  const p={
    id:cleanId(get("id","id pc")),
    nom:get("nom","nom du pc"),
    prix:get("prix","prix de vente (cad)"),
    statut:get("statut"),
    cpu:get("cpu","processeur"),
    gpu:get("gpu","carte graphique"),
    ram:get("ram"),
    stockage:get("stockage"),
    format:get("format"),
    os:get("os","windows","système"),
    description:get("description"),
    etat:get("etat","état"),
    garantie:get("garantie")
  };
  for(let i=1;i<=6;i++) p["photo"+i]=driveImageUrl(get("photo"+i,"photo "+i));
  return p;
}

function photoList(pc){
  return [pc.photo1,pc.photo2,pc.photo3,pc.photo4,pc.photo5,pc.photo6].filter(Boolean);
}

function render(pc){
  const photos=photoList(pc);
  document.title=(pc.nom||"PC")+" | ForgePC Mauricie";
  app.innerHTML=`
  <div class="detail-wrap">
    <div class="gallery">
      ${photos[0]?`<img class="main-photo" id="mainPhoto" src="${esc(photos[0])}" alt="${esc(pc.nom||"PC")}" onclick="openLightbox(this.src)">`:""}
      <div class="thumbs">
        ${photos.map((p,i)=>`<img class="thumb" src="${esc(p)}" alt="Photo ${i+1}" onclick="document.getElementById('mainPhoto').src=this.src">`).join("")}
      </div>
    </div>
    <div>
      <div class="status">${esc(pc.statut||"Disponible")}</div>
      <div class="kicker">PC remis à neuf · ${esc(pc.id||wantedId)}</div>
      <h1>${esc(pc.nom||"PC remis à neuf")}</h1>
      <p class="intro">${esc(pc.description||"")}</p>
      <div class="box"><h2>Caractéristiques</h2><ul class="specs">
        <li><strong>Processeur :</strong> ${esc(pc.cpu||"—")}</li>
        <li><strong>Carte graphique :</strong> ${esc(pc.gpu||"—")}</li>
        <li><strong>Mémoire :</strong> ${esc(pc.ram||"—")}</li>
        <li><strong>Stockage :</strong> ${esc(pc.stockage||"—")}</li>
        <li><strong>Format :</strong> ${esc(pc.format||"—")}</li>
        <li><strong>Système :</strong> ${esc(pc.os||"—")}</li>
      </ul></div>
      <div class="box"><h2>État</h2><p>${esc(pc.etat||"Testé et vérifié.")}</p></div>
      ${pc.garantie?`<div class="box"><h2>Garantie</h2><p>${esc(pc.garantie)}</p></div>`:""}
      ${pc.prix?`<div class="box price-box"><h2>Prix</h2><div class="price">${esc(String(pc.prix).includes("$")?pc.prix:pc.prix+" $")}</div></div>`:""}
      <div class="pc-navigation">
        <a class="back" href="inventaire.html">← Retour à l’inventaire</a>
        <a class="rdv-button" href="rendez-vous.html">Prendre rendez-vous →</a>
      </div>
    </div>
  </div>`;
}

function openLightbox(src){
  if(!src)return;
  document.getElementById("lightboxImg").src=src;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
}
document.getElementById("lightbox").addEventListener("click",e=>{
  if(e.target.id==="lightbox")closeLightbox();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeLightbox();
});

(async()=>{
  try{
    const data=parseVisualization(await loadSheetJsonp()).map(normalize);
    const pc=data.find(x=>cleanId(x.id)===wantedId);
    if(!pc) throw new Error("PC introuvable");
    render(pc);
  }catch(e){
    console.error(e);
    app.innerHTML=`
      <div class="error">
        <h1>Impossible de charger la fiche</h1>
        <p>La page n'arrive pas à lire le PC ${esc(wantedId)} dans Google Sheets.</p>
        <p>Le système est configuré pour utiliser directement l'onglet « Inventaire » du Sheet.</p>
        <a class="back" href="inventaire.html">← Retour à l’inventaire</a>
      </div>`;
  }
})();
</script>
</body>
</html>
