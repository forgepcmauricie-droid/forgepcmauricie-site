<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC | ForgePC Mauricie</title><style>:root{--orange:#ff6500;--black:#070809;--muted:#c1c6ca;--max:1180px}*{box-sizing:border-box}body{margin:0;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.container{width:min(calc(100% - 40px),var(--max));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(5,6,7,.96);border-bottom:1px solid #292d30}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{width:205px;height:64px;object-fit:contain;mix-blend-mode:screen}nav{display:flex;gap:30px;align-items:center;text-transform:uppercase;font-weight:800;font-size:.86rem}nav a{padding:8px 0}.btn{border:1px solid var(--orange);border-radius:6px;padding:12px 16px}.menu{display:none}.page{padding:58px 0 85px;min-height:calc(100vh - 78px);background:radial-gradient(circle at 78% 15%,rgba(255,101,0,.1),transparent 30%),linear-gradient(135deg,#070809,#101315 55%,#070809)}.detail-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:34px}.gallery{background:linear-gradient(145deg,#15181b,#0b0d0f);border:1px solid #383d42;border-radius:9px;padding:10px}.main-photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#08090a;border-radius:7px;cursor:zoom-in}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #343a3f;border-radius:6px;cursor:pointer;background:#08090a}.status{display:inline-block;border:1px solid var(--orange);color:var(--orange);padding:7px 10px;border-radius:5px;font-size:.75rem;font-weight:900;text-transform:uppercase}.kicker{color:var(--orange);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;margin-top:15px}.info h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:.95;margin:8px 0 15px}.intro{color:var(--muted)}.box{margin-top:22px;border:1px solid #383d42;border-radius:8px;background:linear-gradient(145deg,#15181b,#0b0d0f);padding:20px}.box h2{text-transform:uppercase;font-size:1.08rem;margin:0 0 13px}.specs{list-style:none;padding:0;margin:0;display:grid;gap:9px}.price-box{border-color:var(--orange)}.price{font-size:2.15rem;font-weight:900}.pc-navigation{display:flex;justify-content:space-between;gap:16px;margin-top:28px}.back,.rdv{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 18px;border-radius:6px;font-weight:900;text-transform:uppercase}.back{border:1px solid #555;background:#111315}.rdv{background:var(--orange);color:#08090a;border:1px solid var(--orange)}.error{padding:30px;border:1px solid #383d42;border-radius:8px;background:#101214}footer{border-top:1px solid #24282c;padding:22px 0;text-align:center;color:#9ea4a9;font-size:.84rem}footer strong{color:var(--orange)}.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh}.close{position:fixed;right:18px;top:15px;background:#111;color:#fff;border:1px solid #777;border-radius:6px;padding:8px 12px}@media(max-width:900px){nav{display:none}.menu{display:block;background:#111;color:#fff;border:1px solid #555;border-radius:6px;padding:8px 11px}.detail-wrap{grid-template-columns:1fr}}@media(max-width:560px){.container{width:calc(100% - 28px)}.thumbs{grid-template-columns:repeat(2,1fr)}.pc-navigation{flex-direction:column}.pc-navigation a{width:100%}.brand{width:170px}}
</style></head><body><header><div class="container nav"><a href="index.html" style="display:flex;align-items:center;gap:10px"><img class="brand" src="assets/logo.png" alt="ForgePC Mauricie" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;font-weight:900;font-size:20px;letter-spacing:-1px">ForgePC Mauricie</span></a><button class="menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><nav><a href="index.html">Accueil</a><a href="inventaire.html">Inventaire</a><a class="btn" href="rendez-vous.html">Demander un rendez-vous</a><a href="index.html#services">Services</a><a href="index.html#service-domicile">À domicile</a><a href="index.html#contact">Contact</a></nav></div></header><main class="page"><div class="container" id="app"><div class="error">Chargement de la fiche…</div></div></main><footer>© 2026 ForgePC Mauricie · Votre technologie, <strong>notre expertise.</strong></footer><div class="lightbox" id="lightbox"><button class="close" onclick="closeLightbox()">✕</button><img id="lightboxImg" alt="Photo du PC"></div><script>
const SHEET_ID='15llqGhrLL9I6SFxyFrxfbNY2ZuBXDswok_BwxPR7JqU',SHEET_NAME='Inventaire';const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;const wantedId=(new URLSearchParams(location.search).get('id')||'001').replace(/^pc[- ]?/i,'').replace(/^0+(?=\d)/,'');const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function csv(t){let R=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='\"'&&q&&n==='\"'){c+='\"';i++;continue}if(x==='\"'){q=!q;continue}if(x===','&&!q){r.push(c.trim());c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c.trim());c='';if(r.some(v=>v))R.push(r);r=[];continue}c+=x}if(c||r.length){r.push(c.trim());R.push(r)}let h=(R.shift()||[]).map(x=>x.replace(/^\ufeff/,'').toLowerCase().trim());return R.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}
function get(r,...k){for(const x of k)if(r[x]&&String(r[x]).trim())return String(r[x]).trim();return''}function norm(r){return{id:get(r,'id','id pc').replace(/^pc[- ]?/i,'').replace(/^0+(?=\d)/,''),nom:get(r,'nom','nom du pc'),prix:get(r,'prix','prix de vente (cad)'),statut:get(r,'statut'),cpu:get(r,'cpu','processeur'),gpu:get(r,'gpu','carte graphique'),ram:get(r,'ram'),stockage:get(r,'stockage'),format:get(r,'format'),os:get(r,'os','windows','système'),description:get(r,'description'),etat:get(r,'etat','état'),garantie:get(r,'garantie'),photo1:get(r,'photo1','photo 1'),photo2:get(r,'photo2','photo 2'),photo3:get(r,'photo3','photo 3'),photo4:get(r,'photo4','photo 4'),photo5:get(r,'photo5','photo 5'),photo6:get(r,'photo6','photo 6')}}
function driveId(s){let m=String(s||'').match(/drive\.google\.com\/file\/d\/([^/?#]+)/i);if(!m)m=String(s||'').match(/[?&]id=([^&#]+)/i);return m?m[1]:''}function urls(v){let s=String(v||'').trim();if(!s)return[];let id=driveId(s);if(!id)return[s];return[`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`,`https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`]}
const fallbackIds=['1X7gHa-J2931albRMSKmQOvmEJGTDkI8C','1SssNhdq7kWD4QBYVhvU9fTHrZp8XWlt9','1xTkuL-2kNebvspArwWCj6krRZmFhKyL3','1K1AjUhxDf1A-uGrfHtih9p0dj4s4HLqN'];function photos(pc){let a=[pc.photo1,pc.photo2,pc.photo3,pc.photo4,pc.photo5,pc.photo6].flatMap(urls);return a.length?[...new Set(a)]:wantedId==='001'?fallbackIds.map(x=>`https://drive.google.com/thumbnail?id=${x}&sz=w1600`):[]}
async function load(){let pc=null;try{let r=await fetch(`${SHEET_URL}&_=${Date.now()}`,{cache:'no-store'});if(r.ok)pc=csv(await r.text()).map(norm).find(x=>x.id===wantedId)}catch(e){}if(!pc){app.innerHTML='<div class="error"><h1>PC introuvable</h1><a class="back" href="inventaire.html">← Retour à l’inventaire</a></div>';return}render(pc)}
function driveId(s){let m=String(s||'').match(/drive\.google\.com\/file\/d\/([^/]+)/i)||String(s||'').match(/[?&]id=([^&]+)/i)||String(s||'').match(/drive\.google\.com\/open\?id=([^&]+)/i);return m?m[1]:''} function driveUrl(s){let id=driveId(s);if(!id)return String(s||'');return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`} function urls(s){return driveUrl(s)} function photos(pc){return [pc.photo1,pc.photo2,pc.photo3,pc.photo4,pc.photo5,pc.photo6].filter(Boolean).map(driveUrl)} function render(pc){let ps=photos(pc);document.title=`${pc.nom||'PC'} | ForgePC Mauricie`;app.innerHTML=`<div class="detail-wrap"><div class="gallery">${ps[0]?`<img id="mainPhoto" class="main-photo" src="${esc(ps[0])}" alt="${esc(pc.nom)}">`:''}<div class="thumbs">${ps.map((p,i)=>`<img class="thumb" src="${esc(p)}" data-src="${esc(p)}" alt="Photo ${i+1}">`).join('')}</div></div><div class="info"><div class="status">${esc(pc.statut||'Disponible')}</div><div class="kicker">PC remis à neuf · ${esc(pc.id)}</div><h1>${esc(pc.nom)}</h1><p class="intro">${esc(pc.description)}</p><div class="box"><h2>Caractéristiques</h2><ul class="specs"><li><strong>Processeur :</strong> ${esc(pc.cpu||'—')}</li><li><strong>Carte graphique :</strong> ${esc(pc.gpu||'—')}</li><li><strong>Mémoire :</strong> ${esc(pc.ram||'—')}</li><li><strong>Stockage :</strong> ${esc(pc.stockage||'—')}</li><li><strong>Format :</strong> ${esc(pc.format||'—')}</li><li><strong>Système :</strong> ${esc(pc.os||'—')}</li></ul></div><div class="box"><h2>État</h2><p>${esc(pc.etat||'Testé et vérifié.')}</p></div>${pc.garantie?`<div class="box"><h2>Garantie</h2><p>${esc(pc.garantie)}</p></div>`:''}<div class="box price-box"><h2>Prix</h2><div class="price">${esc(pc.prix||'Prix à venir')}</div></div><div class="pc-navigation"><a class="back" href="inventaire.html">← Retour à l’inventaire</a><a class="rdv" href="rendez-vous.html">Prendre rendez-vous →</a></div></div></div>`;let m=document.getElementById('mainPhoto');if(m){m.onerror=()=>{let a=urls(m.src),id=driveId(m.src);if(id&&m.src.includes('/thumbnail'))m.src=`https://drive.google.com/uc?export=view&id=${id}`;else m.style.display='none'};m.onclick=()=>openLightbox(m.src)}document.querySelectorAll('.thumb').forEach(t=>{t.onerror=()=>t.style.display='none';t.onclick=()=>{if(m){m.style.display='block';m.src=t.dataset.src}}})}
function openLightbox(s){document.getElementById('lightboxImg').src=s;document.getElementById('lightbox').classList.add('open')}function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}load();</script></body></html>
