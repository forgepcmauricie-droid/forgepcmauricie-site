<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC | ForgePC Mauricie</title><style>:root{--orange:#ff6500;--black:#070809;--muted:#c1c6ca;--max:1180px}*{box-sizing:border-box}body{margin:0;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.container{width:min(calc(100% - 40px),var(--max));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(5,6,7,.96);border-bottom:1px solid #292d30}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{width:205px;height:64px;object-fit:contain;mix-blend-mode:screen}nav{display:flex;gap:30px;align-items:center;text-transform:uppercase;font-weight:800;font-size:.86rem}nav a{padding:8px 0}.btn{border:1px solid var(--orange);border-radius:6px;padding:12px 16px}.menu{display:none}.page{padding:58px 0 85px;min-height:calc(100vh - 78px);background:radial-gradient(circle at 78% 15%,rgba(255,101,0,.1),transparent 30%),linear-gradient(135deg,#070809,#101315 55%,#070809)}.detail-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:34px}.gallery{background:linear-gradient(145deg,#15181b,#0b0d0f);border:1px solid #383d42;border-radius:9px;padding:10px}.main-photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#08090a;border-radius:7px;cursor:zoom-in}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #343a3f;border-radius:6px;cursor:pointer;background:#08090a}.status{display:inline-block;border:1px solid var(--orange);color:var(--orange);padding:7px 10px;border-radius:5px;font-size:.75rem;font-weight:900;text-transform:uppercase}.kicker{color:var(--orange);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;margin-top:15px}.info h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:.95;margin:8px 0 15px}.intro{color:var(--muted)}.box{margin-top:22px;border:1px solid #383d42;border-radius:8px;background:linear-gradient(145deg,#15181b,#0b0d0f);padding:20px}.box h2{text-transform:uppercase;font-size:1.08rem;margin:0 0 13px}.specs{list-style:none;padding:0;margin:0;display:grid;gap:9px}.price-box{border-color:var(--orange)}.price{font-size:2.15rem;font-weight:900}.pc-navigation{display:flex;justify-content:space-between;gap:16px;margin-top:28px}.back,.rdv{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 18px;border-radius:6px;font-weight:900;text-transform:uppercase}.back{border:1px solid #555;background:#111315}.rdv{background:var(--orange);color:#08090a;border:1px solid var(--orange)}.error{padding:30px;border:1px solid #383d42;border-radius:8px;background:#101214}footer{border-top:1px solid #24282c;padding:22px 0;text-align:center;color:#9ea4a9;font-size:.84rem}footer strong{color:var(--orange)}.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh}.close{position:fixed;right:18px;top:15px;background:#111;color:#fff;border:1px solid #777;border-radius:6px;padding:8px 12px}@media(max-width:900px){nav{display:none}.menu{display:block;background:#111;color:#fff;border:1px solid #555;border-radius:6px;padding:8px 11px}.detail-wrap{grid-template-columns:1fr}}@media(max-width:560px){.container{width:calc(100% - 28px)}.thumbs{grid-template-columns:repeat(2,1fr)}.pc-navigation{flex-direction:column}.pc-navigation a{width:100%}.brand{width:170px}}
</style></head><body><header><div class="container nav"><a href="index.html"><img class="brand" src="assets/logo.png" alt="ForgePC Mauricie"></a><button class="menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><nav><a href="index.html">Accueil</a><a href="inventaire.html">Inventaire</a><a class="btn" href="rendez-vous.html">Demander un rendez-vous</a><a href="index.html#services">Services</a><a href="index.html#service-domicile">À domicile</a><a href="index.html#contact">Contact</a></nav></div></header><main class="page"><div class="container" id="app"><div class="error">Chargement de la fiche…</div></div></main><footer>© 2026 ForgePC Mauricie · Votre technologie, <strong>notre expertise.</strong></footer><div class="lightbox" id="lightbox"><button class="close" onclick="closeLightbox()">✕</button><img id="lightboxImg" alt="Photo du PC"></div><script>
const SHEET_ID = "15llqGhrLL9I6SFxyFrxfbNY2ZuBXDswok_BwxPR7JqU";
const SHEET_NAME = "Inventaire";

const SHEET_CSV_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

const wantedId =
  String(new URLSearchParams(location.search).get("id") || "001")
    .trim()
    .replace(/^pc[- ]?/i, "")
    .replace(/^0+(?=\d)/, "") || "001";

const app = document.getElementById("app");

const FALLBACK = {
  "001": {
    id:"001",
    nom:"Lenovo ThinkCentre M73 Tiny",
    prix:"169,95 $",
    statut:"Bientôt disponible",
    cpu:"Intel Core i5-4570T",
    gpu:"Intel HD Graphics",
    ram:"8 Go RAM",
    stockage:"SSD Kingston A400 240 Go",
    format:"ThinkCentre Tiny — très compact",
    os:"Windows 10",
    description:"Un PC compact, fiable et économique, préparé avec soin par ForgePC Mauricie. Idéal pour la bureautique, Internet, les courriels, les vidéos et les tâches quotidiennes.",
    etat:"Testé et vérifié.",
    garantie:"30 jours",
    photo1:"https://drive.google.com/thumbnail?id=1X7gHa-J2931albRMSKmQOvmEJGTDkI8C&sz=w1600",
    photo2:"https://drive.google.com/thumbnail?id=1SssNhdq7kWD4QBYVhvU9fTHrZp8XWlt9&sz=w1600",
    photo3:"https://drive.google.com/thumbnail?id=1xTkuL-2kNebvspArwWCj6krRZmFhKyL3&sz=w1600",
    photo4:"https://drive.google.com/thumbnail?id=1K1AjUhxDf1A-uGrfHtih9p0dj4s4HLqN&sz=w1600"
  }
};

function esc(value){
  return String(value ?? "").replace(/[&<>"]/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"
  }[c]));
}

function cleanId(value){
  return String(value ?? "")
    .trim()
    .replace(/^pc[- ]?/i, "");
}

function parseCSV(text){
  const rows = [];
  let row = [], cell = "", quoted = false;

  for(let i=0; i<text.length; i++){
    const c = text[i], n = text[i+1];

    if(c === '"' && quoted && n === '"'){
      cell += '"';
      i++;
      continue;
    }

    if(c === '"'){
      quoted = !quoted;
      continue;
    }

    if(c === ',' && !quoted){
      row.push(cell.trim());
      cell = "";
      continue;
    }

    if((c === '\n' || c === '\r') && !quoted){
      if(c === '\r' && n === '\n') i++;
      row.push(cell.trim());
      cell = "";

      if(row.some(v => v !== "")) rows.push(row);
      row = [];
      continue;
    }

    cell += c;
  }

  if(cell !== "" || row.length){
    row.push(cell.trim());
    rows.push(row);
  }

  if(!rows.length) return [];

  const headers = rows[0].map(h =>
    h.replace(/^\ufeff/, "").toLowerCase().trim()
  );

  return rows.slice(1)
    .map(r => Object.fromEntries(
      headers.map((h,i) => [h, r[i] ?? ""])
    ))
    .filter(x => Object.values(x).some(v => String(v).trim() !== ""));
}

function normalize(row){
  const get = (...keys) => {
    for(const key of keys){
      if(row[key] !== undefined &&
         row[key] !== null &&
         String(row[key]).trim() !== ""){
        return String(row[key]).trim();
      }
    }
    return "";
  };

  const pc = {
    id: cleanId(get("id","id pc")),
    nom: get("nom","nom du pc"),
    prix: get("prix","prix de vente (cad)"),
    statut: get("statut"),
    cpu: get("cpu","processeur"),
    gpu: get("gpu","carte graphique"),
    ram: get("ram"),
    stockage: get("stockage"),
    format: get("format"),
    os: get("os","windows","système"),
    description: get("description"),
    etat: get("etat","état"),
    garantie: get("garantie")
  };

  for(let i=1; i<=6; i++){
    pc["photo"+i] = normalizeDriveUrl(
      get("photo"+i, "photo "+i)
    );
  }

  return pc;
}

function driveId(value){
  const s = String(value || "");

  let m = s.match(/drive\.google\.com\/file\/d\/([^/?#]+)/i);
  if(!m) m = s.match(/[?&]id=([^&#]+)/i);
  if(!m) m = s.match(/drive\.google\.com\/open\?id=([^&#]+)/i);

  return m ? m[1] : "";
}

function normalizeDriveUrl(value){
  const s = String(value || "").trim();
  if(!s) return "";

  if(s.startsWith("data:") || s.startsWith("blob:"))
    return s;

  const id = driveId(s);
  if(!id) return s;

  // Thumbnail works more reliably than the Drive preview page for <img>.
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`;
}

function loadJsonp(){
  return new Promise((resolve,reject)=>{
    const callback =
      "forgepcSheets_" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");
    let finished = false;

    const cleanup = () => {
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      delete window[callback];
      script.remove();
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Google Sheets JSONP timeout"));
    }, 10000);

    window[callback] = data => {
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("Google Sheets JSONP error"));
    };

    script.src =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
      `?sheet=${encodeURIComponent(SHEET_NAME)}` +
      `&tqx=${encodeURIComponent("responseHandler:" + callback)}`;

    document.head.appendChild(script);
  });
}

function parseVisualization(data){
  const table = data && data.table;

  if(!table || !Array.isArray(table.cols) || !Array.isArray(table.rows))
    return [];

  const headers = table.cols.map(c =>
    String(c.label || c.id || "").toLowerCase().trim()
  );

  return table.rows.map(r => {
    const values = (r.c || []).map(c => {
      if(!c) return "";
      return c.v !== undefined && c.v !== null
        ? String(c.v)
        : "";
    });

    const obj = {};
    headers.forEach((h,i) => obj[h] = values[i] ?? "");
    return obj;
  })
  .filter(x => Object.values(x).some(v => String(v).trim() !== ""))
  .map(normalize);
}

async function getInventory(){
  // 1 — même méthode que la page Inventaire.
  try{
    const response = await fetch(
      `${SHEET_CSV_URL}&_=${Date.now()}`,
      {cache:"no-store"}
    );

    if(response.ok){
      const rows = parseCSV(await response.text()).map(normalize);
      if(rows.length) return rows;
    }
  }catch(error){
    console.warn("CSV Google Sheets indisponible.", error);
  }

  // 2 — secours sans CORS avec Google Visualization / JSONP.
  try{
    const rows = parseVisualization(await loadJsonp());
    if(rows.length) return rows;
  }catch(error){
    console.warn("JSONP Google Sheets indisponible.", error);
  }

  return [];
}

function photoList(pc){
  return [
    pc.photo1, pc.photo2, pc.photo3,
    pc.photo4, pc.photo5, pc.photo6
  ].filter(Boolean);
}

function render(pc){
  const photos = photoList(pc);

  document.title =
    `${pc.nom || "PC"} | ForgePC Mauricie`;

  app.innerHTML = `
    <div class="detail-wrap">
      <div class="gallery">
        ${
          photos[0]
          ? `<img id="mainPhoto"
                  class="main-photo"
                  src="${esc(photos[0])}"
                  alt="${esc(pc.nom || "PC")}">`
          : `<div class="error">Aucune photo disponible.</div>`
        }

        <div class="thumbs">
          ${photos.map((photo,index) => `
            <img class="thumb"
                 src="${esc(photo)}"
                 data-src="${esc(photo)}"
                 alt="Photo ${index+1}">
          `).join("")}
        </div>
      </div>

      <div class="info">
        <div class="status">
          ${esc(pc.statut || "Disponible")}
        </div>

        <div class="kicker">
          PC remis à neuf · ${esc(pc.id || wantedId)}
        </div>

        <h1>${esc(pc.nom || "PC remis à neuf")}</h1>

        <p class="intro">
          ${esc(pc.description || "")}
        </p>

        <div class="box">
          <h2>Caractéristiques</h2>
          <ul class="specs">
            <li><strong>Processeur :</strong> ${esc(pc.cpu || "—")}</li>
            <li><strong>Carte graphique :</strong> ${esc(pc.gpu || "—")}</li>
            <li><strong>Mémoire :</strong> ${esc(pc.ram || "—")}</li>
            <li><strong>Stockage :</strong> ${esc(pc.stockage || "—")}</li>
            <li><strong>Format :</strong> ${esc(pc.format || "—")}</li>
            <li><strong>Système :</strong> ${esc(pc.os || "—")}</li>
          </ul>
        </div>

        <div class="box">
          <h2>État</h2>
          <p>${esc(pc.etat || "Testé et vérifié.")}</p>
        </div>

        ${
          pc.garantie
          ? `<div class="box">
               <h2>Garantie</h2>
               <p>${esc(pc.garantie)}</p>
             </div>`
          : ""
        }

        <div class="box price-box">
          <h2>Prix</h2>
          <div class="price">
            ${esc(pc.prix || "Prix à venir")}
          </div>
        </div>

        <div class="pc-navigation">
          <a class="back" href="inventaire.html">
            ← Retour à l’inventaire
          </a>
          <a class="rdv" href="rendez-vous.html">
            Prendre rendez-vous →
          </a>
        </div>
      </div>
    </div>
  `;

  const main = document.getElementById("mainPhoto");

  if(main){
    main.onclick = () => openLightbox(main.src);

    main.onerror = () => {
      const id = driveId(main.src);

      if(id && main.src.includes("/thumbnail")){
        main.src =
          `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`;
      }else{
        main.style.display = "none";
      }
    };
  }

  document.querySelectorAll(".thumb").forEach(thumb => {
    thumb.onerror = () => thumb.style.display = "none";

    thumb.onclick = () => {
      if(main){
        main.style.display = "block";
        main.src = thumb.dataset.src;
      }
    };
  });
}

function openLightbox(src){
  if(!src) return;

  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
}

document.getElementById("lightbox").addEventListener("click", e => {
  if(e.target.id === "lightbox") closeLightbox();
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeLightbox();
});

(async()=>{
  const inventory = await getInventory();

  let pc = inventory.find(
    item => cleanId(item.id) === wantedId
  );

  // Si Google Sheets n'est pas accessible à ce moment,
  // PC-001 reste fonctionnel au lieu d'afficher une erreur.
  if(!pc && FALLBACK[wantedId]){
    pc = FALLBACK[wantedId];
  }

  if(!pc){
    app.innerHTML = `
      <div class="error">
        <h1>PC introuvable</h1>
        <p>
          Aucun PC avec l'identifiant
          <strong>${esc(wantedId)}</strong>
          n'a été trouvé dans l'inventaire.
        </p>
        <a class="back" href="inventaire.html">
          ← Retour à l’inventaire
        </a>
      </div>
    `;
    return;
  }

  render(pc);
})();
</script></body></html>
