<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fiche PC remis à neuf — ForgePC Mauricie"><meta name="theme-color" content="#08090a"><title>PC | ForgePC Mauricie</title>
<style>
:root{--orange:#ff6500;--black:#070809;--muted:#c1c6ca;--max:1180px}*{box-sizing:border-box}body{margin:0;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.container{width:min(calc(100% - 40px),var(--max));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(5,6,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid #292d30}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{width:205px;height:64px;object-fit:contain;mix-blend-mode:screen}.menu{display:none;background:none;border:1px solid #555;color:#fff;border-radius:6px;padding:8px 11px;font-size:1.2rem}nav{display:flex;gap:30px;align-items:center;text-transform:uppercase;font-weight:800;font-size:.86rem}nav a{padding:8px 0;border-bottom:2px solid transparent}nav a:hover{color:var(--orange);border-color:var(--orange)}.btn{border:1px solid var(--orange);border-radius:6px;padding:12px 16px}.page{padding:58px 0 85px;background:radial-gradient(circle at 78% 15%,rgba(255,101,0,.10),transparent 30%),linear-gradient(135deg,#070809,#101315 55%,#070809);min-height:calc(100vh - 78px)}.detail-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:start}.gallery{background:linear-gradient(145deg,#15181b,#0b0d0f);border:1px solid #383d42;border-radius:9px;padding:10px}.main-photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#08090a;border-radius:7px;cursor:zoom-in}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #343a3f;border-radius:6px;cursor:pointer;background:#08090a}.info .status{display:inline-block;border:1px solid var(--orange);color:var(--orange);padding:7px 10px;border-radius:5px;font-size:.75rem;font-weight:900;text-transform:uppercase}.kicker{color:var(--orange);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;margin-top:15px}.info h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:.95;margin:8px 0 15px;letter-spacing:-.04em}.intro{color:var(--muted);font-size:1rem}.box{margin-top:22px;border:1px solid #383d42;border-radius:8px;background:linear-gradient(145deg,#15181b,#0b0d0f);padding:20px}.box h2{font-size:1.08rem;text-transform:uppercase;margin:0 0 13px}.specs{list-style:none;padding:0;margin:0;display:grid;gap:9px}.specs strong{color:#fff}.price-box{border-color:var(--orange)}.price{font-size:2.15rem;font-weight:900;color:#fff}.back{display:inline-block;margin-top:25px;color:#d6dadd;font-weight:800}.back:hover{color:var(--orange)}.error{padding:30px;border:1px solid #383d42;border-radius:8px;background:#101214}.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}.lightbox.open{display:flex}.lightbox img{max-width:min(95vw,1200px);max-height:90vh;object-fit:contain}.close{position:fixed;right:18px;top:15px;border:1px solid #777;background:#111;color:#fff;border-radius:6px;padding:8px 12px;font-size:1.1rem}footer{border-top:1px solid #24282c;padding:22px 0;text-align:center;color:#9ea4a9;font-size:.84rem}footer strong{color:var(--orange)}
@media(max-width:900px){.nav{min-height:70px}.brand{width:170px;height:58px}nav{display:none;position:absolute;left:0;right:0;top:70px;background:#08090a;border-bottom:1px solid #30353a;flex-direction:column;gap:0;padding:10px 20px}nav.open{display:flex}nav a{width:100%;padding:13px 0}.menu{display:block}.container{width:min(calc(100% - 32px),var(--max))}.detail-wrap{grid-template-columns:1fr}.page{padding:45px 0 65px}}@media(max-width:560px){.container{width:min(calc(100% - 28px),var(--max))}.thumbs{grid-template-columns:repeat(2,1fr)}}
</style>
<style>
.pc-navigation{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:28px}
.rdv-button{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:1px solid var(--orange);border-radius:6px;background:var(--orange);color:#08090a;font-weight:900;text-transform:uppercase;text-decoration:none}
.rdv-button:hover{filter:brightness(1.08)}
@media(max-width:560px){.pc-navigation{flex-direction:column;align-items:stretch}.pc-navigation a{width:100%;text-align:center}}
</style>
</head><body><header><div class="container nav"><a href="index.html"><img class="brand" src="assets/logo.png" alt="ForgePC Mauricie"></a><button class="menu" aria-label="Ouvrir le menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><nav><a href="index.html">Accueil</a><a href="inventaire.html">Inventaire</a><a class="btn" href="rendez-vous.html">Demander un rendez-vous</a><a href="index.html#services">Services</a><a href="index.html#service-domicile">À domicile</a><a href="index.html#contact">Contact</a></nav></div></header><main class="page"><div class="container" id="app"><div class="error">Chargement de la fiche…</div></div></main><footer>© 2026 ForgePC Mauricie · Votre technologie, <strong>notre expertise.</strong></footer><div class="lightbox" id="lightbox"><button class="close" onclick="closeLightbox()">✕</button><img id="lightboxImg" alt="Photo du PC"></div>
<script src="inventaire.js"></script><script>
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>document.querySelector('nav').classList.remove('open')));
const id=new URLSearchParams(location.search).get('id'); const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function photoList(pc){return [pc.photo1,pc.photo2,pc.photo3,pc.photo4,pc.photo5,pc.photo6].filter(Boolean)}
function render(pc){document.title=`${pc.nom} | ForgePC Mauricie`;const photos=photoList(pc); const main=photos[0]||'';app.innerHTML=`<div class="detail-wrap"><div class="gallery">${main?`<img class="main-photo" id="mainPhoto" src="${esc(main)}" alt="${esc(pc.nom)}" onclick="openLightbox(this.src)">`:''}<div class="thumbs">${photos.map((p,i)=>`<img class="thumb" src="${esc(p)}" alt="${esc(pc.nom)} — photo ${i+1}" onclick="document.getElementById('mainPhoto').src=this.src">`).join('')}</div></div><div class="info"><div class="status">${esc(pc.statut||'Disponible')}</div><div class="kicker">PC remis à neuf · ${esc(pc.id)}</div><h1>${esc(pc.nom)}</h1><p class="intro">${esc(pc.description)}</p><div class="box"><h2>Caractéristiques</h2><ul class="specs"><li><strong>Processeur :</strong> ${esc(pc.cpu||'—')}</li><li><strong>Carte graphique :</strong> ${esc(pc.gpu||'—')}</li><li><strong>Mémoire :</strong> ${esc(pc.ram||'—')}</li><li><strong>Stockage :</strong> ${esc(pc.stockage||'—')}</li><li><strong>Format :</strong> ${esc(pc.format||'—')}</li><li><strong>Système :</strong> ${esc(pc.os||'—')}</li></ul></div><div class="box"><h2>État</h2><p>${esc(pc.etat||'Testé et vérifié.')}</p></div>${pc.garantie?`<div class="box"><h2>Garantie</h2><p>${esc(pc.garantie)}</p></div>`:''}<div class="box price-box"><h2>Prix</h2><div class="price">${esc(money(pc.prix))}</div></div><div class="pc-navigation">
<a class="back" href="inventaire.html">← Retour à l’inventaire</a>
<a class="rdv-button" href="rendez-vous.html">Prendre rendez-vous →</a>
</div></div></div>`}
function openLightbox(src){if(!src)return;document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden'}function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow=''}
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
(async()=>{const data=await getInventory();const pc=data.find(x=>x.id===id);if(!pc){app.innerHTML='<div class="error"><h1>PC introuvable</h1><p>Cette fiche n’est plus disponible.</p><a class="back" href="inventaire.html">← Retour à l’inventaire</a></div>';return}render(pc)})();
</script></body></html>
