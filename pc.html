<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC | ForgePC Mauricie</title>
<style>
:root{--orange:#ff6500;--black:#070809;--muted:#c1c6ca;--max:1180px}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.container{width:min(calc(100% - 40px),var(--max));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(5,6,7,.96);border-bottom:1px solid #292d30}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{width:205px;height:64px;object-fit:contain;mix-blend-mode:screen}
nav{display:flex;gap:30px;align-items:center;text-transform:uppercase;font-weight:800;font-size:.86rem}
nav a{padding:8px 0}
.btn{border:1px solid var(--orange);border-radius:6px;padding:12px 16px}
.menu{display:none}
.page{padding:58px 0 85px;min-height:calc(100vh - 78px);background:radial-gradient(circle at 78% 15%,rgba(255,101,0,.1),transparent 30%),linear-gradient(135deg,#070809,#101315 55%,#070809)}
.detail-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:34px}
.gallery{background:linear-gradient(145deg,#15181b,#0b0d0f);border:1px solid #383d42;border-radius:9px;padding:10px}
.main-photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#08090a;border-radius:7px;cursor:zoom-in}
.no-photo{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#08090a;border-radius:7px;color:#9ea4a9}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #343a3f;border-radius:6px;cursor:pointer;background:#08090a}
.thumb:hover{border-color:var(--orange)}
.status{display:inline-block;border:1px solid var(--orange);color:var(--orange);padding:7px 10px;border-radius:5px;font-size:.75rem;font-weight:900;text-transform:uppercase}
.kicker{color:var(--orange);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;margin-top:15px}
.info h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:.95;margin:8px 0 15px}
.intro{color:var(--muted)}
.box{margin-top:22px;border:1px solid #383d42;border-radius:8px;background:linear-gradient(145deg,#15181b,#0b0d0f);padding:20px}
.box h2{text-transform:uppercase;font-size:1.08rem;margin:0 0 13px}
.specs{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.price-box{border-color:var(--orange)}
.price{font-size:2.15rem;font-weight:900;color:#fff}
.pc-navigation{display:flex;justify-content:space-between;gap:16px;margin-top:28px}
.back,.rdv{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 18px;border-radius:6px;font-weight:900;text-transform:uppercase}
.back{border:1px solid #555;background:#111315}
.rdv{background:var(--orange);color:#08090a;border:1px solid var(--orange)}
.error{padding:30px;border:1px solid #383d42;border-radius:8px;background:#101214}
footer{border-top:1px solid #24282c;padding:22px 0;text-align:center;color:#9ea4a9;font-size:.84rem}
footer strong{color:var(--orange)}
.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
.close{position:fixed;right:18px;top:15px;background:#111;color:#fff;border:1px solid #777;border-radius:6px;padding:8px 12px}
@media(max-width:900px){nav{display:none}.menu{display:block;background:#111;color:#fff;border:1px solid #555;border-radius:6px;padding:8px 11px}.detail-wrap{grid-template-columns:1fr}}
@media(max-width:560px){.container{width:calc(100% - 28px)}.thumbs{grid-template-columns:repeat(2,1fr)}.pc-navigation{flex-direction:column}.pc-navigation a{width:100%}.brand{width:170px}}
</style>
</head>
<body>
<header>
<div class="container nav">
<a href="index.html" style="display:flex;align-items:center;gap:10px">
<img class="brand" src="assets/logo.png" alt="ForgePC Mauricie"
 onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
<span style="display:none;font-weight:900;font-size:20px;letter-spacing:-1px">ForgePC Mauricie</span>
</a>
<button class="menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
<nav>
<a href="index.html">Accueil</a>
<a href="inventaire.html">Inventaire</a>
<a class="btn" href="rendez-vous.html">Demander un rendez-vous</a>
<a href="index.html#services">Services</a>
<a href="index.html#service-domicile">À domicile</a>
<a href="index.html#contact">Contact</a>
</nav>
</div>
</header>

<main class="page">
<div class="container" id="app"><div class="error">Chargement de la fiche…</div></div>
</main>

<footer>© 2026 ForgePC Mauricie · Votre technologie, <strong>notre expertise.</strong></footer>

<div class="lightbox" id="lightbox">
<button class="close" onclick="closeLightbox()">✕</button>
<img id="lightboxImg" alt="Photo du PC">
</div>

<script>
const SHEET_ID="15llqGhrLL9I6SFxyFrxfbNY2ZuBXDswok_BwxPR7JqU";
const SHEET_NAME="Inventaire";
const app=document.getElementById("app");

function canonicalId(v){
  let s=String(v??"").trim().replace(/^pc[-_ ]?/i,"");
  if(/^\d+$/.test(s)) return String(parseInt(s,10));
  return s.toLowerCase();
}

const params=new URLSearchParams(location.search);
const wantedId=canonicalId(params.get("pcid")||params.get("id")||"1");

function esc(v){
  return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function headerKey(v){
  return String(v??"")
    .replace(/^\ufeff/,"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");
}

function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}
    if(c==='"'){quoted=!quoted;continue}
    if(c===','&&!quoted){row.push(cell.trim());cell="";continue}
    if((c==='\\n'||c==='\\r')&&!quoted){
      if(c==='\\r'&&n==='\\n')i++;
      row.push(cell.trim());cell="";
      if(row.some(v=>v!==""))rows.push(row);
      row=[];continue
    }
    cell+=c;
  }
  if(cell!==""||row.length){row.push(cell.trim());rows.push(row)}
  if(!rows.length)return[];
  const headers=rows[0].map(headerKey);
  return rows.slice(1).map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=r[i]??"");
    return o;
  });
}

function get(row,...names){
  for(const n of names){
    const k=headerKey(n);
    if(row[k]!==undefined && String(row[k]).trim()!=="")
      return String(row[k]).trim();
  }
  return "";
}

function normalize(row){
  const p={
    id:canonicalId(get(row,"id","id pc")),
    nom:get(row,"nom","nom du pc"),
    prix:get(row,"prix","prix de vente (cad)","prix de vente"),
    statut:get(row,"statut"),
    cpu:get(row,"cpu","processeur"),
    gpu:get(row,"gpu","carte graphique"),
    ram:get(row,"ram","mémoire","memoire"),
    stockage:get(row,"stockage"),
    format:get(row,"format"),
    os:get(row,"os","windows","système","systeme"),
    description:get(row,"description"),
    etat:get(row,"etat","état"),
    garantie:get(row,"garantie"),
    photo1:get(row,"photo1","photo 1"),
    photo2:get(row,"photo2","photo 2"),
    photo3:get(row,"photo3","photo 3"),
    photo4:get(row,"photo4","photo 4"),
    photo5:get(row,"photo5","photo 5"),
    photo6:get(row,"photo6","photo 6")
  };
  return p;
}

function driveId(value){
  const s=String(value||"");
  let m=s.match(/drive\\.google\\.com\\/file\\/d\\/([^/?#]+)/i);
  if(m)return m[1];
  m=s.match(/[?&]id=([^&#]+)/i);
  if(m)return m[1];
  m=s.match(/drive\\.google\\.com\\/open\\?id=([^&#]+)/i);
  return m?m[1]:"";
}

function imageUrl(value){
  const s=String(value||"").trim();
  if(!s)return "";
  if(s.startsWith("data:")||s.startsWith("blob:"))return s;

  const id=driveId(s);
  if(id){
    return "https://drive.google.com/thumbnail?id="+
      encodeURIComponent(id)+"&sz=w1600";
  }
  return s;
}

function loadJsonp(){
  return new Promise((resolve,reject)=>{
    const callback="forgepc_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Google Sheets timeout"));
    },10000);

    function cleanup(){
      clearTimeout(timer);
      delete window[callback];
      script.remove();
    }

    window[callback]=data=>{
      cleanup();
      resolve(data);
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("Google Sheets JSONP error"));
    };

    script.src=
      "https://docs.google.com/spreadsheets/d/"+SHEET_ID+
      "/gviz/tq?sheet="+encodeURIComponent(SHEET_NAME)+
      "&tqx="+encodeURIComponent("responseHandler:"+callback);

    document.head.appendChild(script);
  });
}

function parseGviz(data){
  const table=data&&data.table;
  if(!table||!Array.isArray(table.cols)||!Array.isArray(table.rows))return[];

  const headers=table.cols.map(c=>headerKey(c.label||c.id||""));

  return table.rows.map(r=>{
    const o={};
    headers.forEach((h,i)=>{
      const c=(r.c||[])[i];
      o[h]=c&&c.v!==undefined&&c.v!==null?String(c.v):"";
    });
    return normalize(o);
  }).filter(p=>p.id||p.nom);
}

async function loadInventory(){
  const csvUrl =
    "https://docs.google.com/spreadsheets/d/"+SHEET_ID+
    "/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(SHEET_NAME)+
    "&_="+Date.now();

  // 1) Méthode principale : CSV Google Sheets.
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const response=await fetch(csvUrl,{
      cache:"no-store",
      signal:controller.signal
    });
    clearTimeout(timer);

    if(response.ok){
      const text=await response.text();
      const rows=parseCSV(text).map(normalize);
      if(rows.length)return rows;
    }
  }catch(e){
    console.warn("Lecture CSV Google Sheets échouée",e);
  }

  // 2) Secours : JSONP Google Visualization.
  try{
    const rows=parseGviz(await loadJsonp());
    if(rows.length)return rows;
  }catch(e){
    console.warn("Lecture JSONP Google Sheets échouée",e);
  }

  throw new Error("Google Sheets ne répond pas ou l’onglet Inventaire est inaccessible");
}

function photoList(pc){
  return [
    pc.photo1,pc.photo2,pc.photo3,
    pc.photo4,pc.photo5,pc.photo6
  ].map(imageUrl).filter(Boolean);
}

function render(pc){
  const photos=photoList(pc);

  document.title=(pc.nom||"PC")+" | ForgePC Mauricie";

  const gallery=photos.length
    ? `
      <img id="mainPhoto" class="main-photo"
           src="${esc(photos[0])}"
           alt="${esc(pc.nom||"PC")}"
           onclick="openLightbox(this.src)">
      <div class="thumbs">
        ${photos.map((p,i)=>`
          <img class="thumb"
               src="${esc(p)}"
               alt="Photo ${i+1}"
               onclick="document.getElementById('mainPhoto').src=this.src"
               onerror="this.style.display='none'">
        `).join("")}
      </div>`
    : `<div class="no-photo">Aucune photo disponible.</div>`;

  const specs=[
    ["Processeur",pc.cpu],
    ["Carte graphique",pc.gpu],
    ["Mémoire",pc.ram],
    ["Stockage",pc.stockage],
    ["Format",pc.format],
    ["Système",pc.os]
  ].filter(x=>x[1]);

  app.innerHTML=`
    <div class="detail-wrap">
      <div class="gallery">${gallery}</div>

      <div class="info">
        <div class="status">${esc(pc.statut||"Disponible")}</div>
        <div class="kicker">PC remis à neuf · ${esc(pc.id)}</div>
        <h1>${esc(pc.nom||"PC remis à neuf")}</h1>
        <p class="intro">${esc(pc.description||"")}</p>

        <div class="box">
          <h2>Caractéristiques</h2>
          <ul class="specs">
            ${specs.map(s=>`<li><strong>${esc(s[0])} :</strong> ${esc(s[1])}</li>`).join("")}
          </ul>
        </div>

        ${pc.etat?`<div class="box"><h2>État</h2><p>${esc(pc.etat)}</p></div>`:""}
        ${pc.garantie?`<div class="box"><h2>Garantie</h2><p>${esc(pc.garantie)}</p></div>`:""}

        <div class="box price-box">
          <h2>Prix</h2>
          <div class="price">${esc(pc.prix||"Prix à venir")}</div>
        </div>

        <div class="pc-navigation">
          <a class="back" href="inventaire.html">← Retour à l’inventaire</a>
          <a class="rdv" href="rendez-vous.html">Prendre rendez-vous →</a>
        </div>
      </div>
    </div>
  `;

  const main=document.getElementById("mainPhoto");
  if(main){
    main.onerror=()=>{
      const id=driveId(main.src);
      if(id && main.src.includes("/thumbnail")){
        main.src="https://drive.google.com/uc?export=view&id="+encodeURIComponent(id);
      }else{
        main.outerHTML='<div class="no-photo">Photo indisponible.</div>';
      }
    };
  }
}

function openLightbox(src){
  if(!src)return;
  document.getElementById("lightboxImg").src=src;
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
}

(async()=>{
  try{
    const inventory=await loadInventory();
    const pc=inventory.find(x=>canonicalId(x.id)===wantedId);

    if(!pc){
      throw new Error("PC introuvable dans Google Sheets");
    }

    render(pc);
  }catch(e){
    console.error(e);
    app.innerHTML=`
      <div class="error">
        <h1>Impossible de charger la fiche</h1>
        <p>Le PC <strong>${esc(wantedId)}</strong> n’a pas pu être récupéré de Google Sheets.</p>
        <p>Si cette erreur apparaît, le problème est la lecture du Sheet — pas les photos.</p>
        <p style="color:#ff6500"><strong>Erreur :</strong> ${esc(e && e.message ? e.message : e)}</p>
        <a class="back" href="inventaire.html">← Retour à l’inventaire</a>
      </div>
    `;
  }
})();
</script>
</body>
</html>
